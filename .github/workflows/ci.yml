name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done

          echo "MySQL service did not become ready in time."
          exit 1

      - name: Apply schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < schema.sql

      - name: Apply reference seed
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot trade_operations_suite < seed-reference-data.sql

      - name: Validate reference rows
        run: |
          roles_count="$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM trade_operations_suite.roles;")"
          currencies_count="$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM trade_operations_suite.currencies;")"

          test "$roles_count" = "6"
          test "$currencies_count" = "2"
